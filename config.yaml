# PharmaDash settings. Edit freely; every value here is optional to change.
# Lines starting with # are comments.

plan: free                  # "free" = Groq free tier ($0; limits are in tokens). "paid" = pay-as-you-go ($ cap applies)
series_name: "PharmaDash"
issue_counter: 8            # next issue number; increases automatically after each produce
lookback_days: 10           # how many days back discovery scans (7-14 is typical)
topic_count: 10             # how many topic ideas discovery proposes
article_word_target: [700, 1200]
dashboards_per_issue: 2
min_claims: 5                 # research must find at least this many usable facts, or the run stops instead of guessing
disclaimer: "For information only; not investment advice."

models:                     # Groq model IDs. Change here if Groq retires one (see console.groq.com/docs/models)
  research: openai/gpt-oss-120b
  verifier: openai/gpt-oss-120b
  writer: openai/gpt-oss-120b
  dashboard: openai/gpt-oss-120b
  search: openai/gpt-oss-120b   # must support Groq "browser search" (gpt-oss models do)

model_pool:                 # free models, tried in order when one hits its daily limit (each has its own 200K tokens/day)
  - openai/gpt-oss-120b
  - openai/gpt-oss-20b
  - qwen/qwen3.8-27b

pricing_per_million_tokens:     # USD, used only for the cost estimate; update if Groq changes prices
  openai/gpt-oss-120b: {input: 0.15, output: 0.60}
  openai/gpt-oss-20b: {input: 0.075, output: 0.30}
  qwen/qwen3.8-27b: {input: 0.80, output: 4.00}

usage_limits:               # hard caps per run; the run stops cleanly if reached
  max_tokens_per_run: 400000    # used on the free plan
  max_cost_usd: 3.0             # used if plan: paid
  max_searches: 120
  max_fetches: 400
  max_turns_per_agent: 25

scoring_weights:            # discovery ranking; higher = matters more
  recency: 1.0
  financial_magnitude: 1.5
  relevance: 1.5
  dashboard_ability: 1.2
  freshness_vs_history: 1.3
  reader_interest: 1.0

themes:
  - M&A and licensing
  - Earnings and guidance
  - Blockbuster drugs and patent cliff (LOE)
  - Obesity / GLP-1
  - Oncology
  - AI in drug discovery
  - FDA / regulatory and pricing policy (IRA, MFN, tariffs)
  - China licensing
  - Clinical readouts

