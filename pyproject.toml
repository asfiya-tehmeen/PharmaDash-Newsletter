[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmadash"
version = "0.1.0"
description = "Autonomous editorial-research agent for the PharmaDash newsletter"
requires-python = ">=3.11"
dependencies = [
  "groq==1.7.0", "typer==0.27.3", "rich==15.0.0", "pydantic==2.14.1",
  "httpx==0.28.1", "feedparser==6.0.14", "PyYAML==6.0.3", "python-dotenv==1.2.4",
]

[project.scripts]
pharmadash = "pharmadash.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pharmadash = ["templates/*", "prompts/*"]
